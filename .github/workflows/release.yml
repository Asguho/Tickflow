name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PW="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PW="$KEY_PASSWORD"
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret set; generating an ephemeral keystore for this release. Users will need to uninstall any previous build before installing a release signed with a different key. Set the RELEASE_KEYSTORE_BASE64/PASSWORD/ALIAS/KEY_PASSWORD secrets to get a stable signature across releases."
            STORE_PW="tickflow"
            ALIAS="tickflow"
            KEY_PW="tickflow"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -dname "CN=Tickflow, OU=Tickflow, O=Tickflow, L=, ST=, C=US"
          fi
          {
            echo "TICKFLOW_RELEASE_KEYSTORE=$KEYSTORE_PATH"
            echo "TICKFLOW_RELEASE_KEYSTORE_PASSWORD=$STORE_PW"
            echo "TICKFLOW_RELEASE_KEY_ALIAS=$ALIAS"
            echo "TICKFLOW_RELEASE_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/Tickflow-*.apk
          fail_on_unmatched_files: true
